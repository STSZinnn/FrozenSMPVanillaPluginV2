name: PunchSnowball
version: 1.3.0
main: com.example.punchsnowball.PunchSnowballPlugin
api-version: '1.21.11'
description: Infinite punch snowball and configurable reusable TNT
commands:
  givesnowball:
    description: Gives a player an infinite Punch Snowball
    usage: /givesnowball [player]
    permission: punchsnowball.give
  givetnt:
    description: Gives a player reusable enchanted Infinite TNT
    usage: /givetnt [player]
    permission: punchsnowball.give
  punchreload:
    description: Reloads snowball and TNT settings from config.yml
    usage: /punchreload
    permission: punchsnowball.reload
permissions:
  punchsnowball.give:
    description: Allows giving custom items
    default: op
  punchsnowball.reload:
    description: Allows reloading settings
    default: op
